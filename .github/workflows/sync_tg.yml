name: Sync Telegram & Deploy Pages

on:
  schedule:
    # 每小时 19、49 分各一次；cron 按 UTC 计算，UTC+8 整点偏移不改变分钟数
    - cron: '19,49 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'scripts/build_view.py'
      - 'data/**'

permissions:
  contents: read

jobs:
  # ---- 1. 事实源同步：仅定时或手动触发，本地 push 自动跳过 ----
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: tg-sync
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.git_check.outputs.has_changes }}
      commit_sha: ${{ steps.git_check.outputs.commit_sha }}
    # 两个话题共用同一账号凭证；WAIT_TIME 不注入（脚本无空串兜底，保持默认 1）
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TARGET_GROUP: "-1002632177660"
      TARGET_USER: "hackbearterry"
      TZ_LOCAL: Asia/Shanghai
      # target = 只下目标用户发的图片，存 data/<session>/media/，随 data/ 一起提交
      DOWNLOAD_MEDIA: target
      REFRESH_RECENT: "200"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      # GITHUB_ACTIONS=true 时 fetch_tg.py 跳过 .env，脚本读取的配置只能在此注入。
      # 话题2 的首次全量在本地完成（生成 data/session2/ 并提交），CI 只拉游标之后的新消息。
      # 串行执行，避免同一 StringSession 并发连接；补图逻辑会顺带补齐历史里目标用户缺的图。
      - name: Fetch topic 2 (incremental)
        env:
          TARGET_TOPIC: "2"
        run: python scripts/fetch_tg.py

      - name: Fetch topic 3 (incremental)
        env:
          TARGET_TOPIC: "3"
        run: python scripts/fetch_tg.py

      # 只提交事实源（含目标用户图片），dist/ 由 .gitignore 排除
      - name: Commit raw data
        id: git_check
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 不带 pathspec：目录为空时也不会报 "did not match any files"
          # 实际只提交 data/session*/ 下的 raw / media / state.json
          # 每个 session 的游标各自按全群推进：非目标话题的消息也会推进 last_msg_id，
          # 因此这里的 diff 判定的是「全群有无新消息」，不等于「站点有无新内容」。
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "全群无新消息，跳过提交与重新部署"
          else
            git commit -m "chore(data): sync telegram raw [skip ci]"
            # 本地 push 可能抢先推进 main（如 11-23 那次 rejected），先变基再推
            git pull --rebase origin main
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---- 2. 展示投影并上传 Pages 产物：纯 Python 标准库，无需 pip install ----
  build:
    needs: sync
    # 本地 push 时 sync 会被 skipped，必须用 !cancelled() 覆盖默认的 success() 检查
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        (needs.sync.result == 'success' && (needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      # sync 刚 push 了新 commit 时，github.sha 仍指向触发前的旧提交，必须按 commit_sha 检出最新数据
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.commit_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # 从 raw 重算，改规则不用重抓；i18n.json 只翻译界面文案，在此做三语键一致性校验。
      # 站点名可按语言覆盖；未配置的 Secret 为空串，脚本回落 DISPLAY_NAME。
      # 引用上下文默认开启：只展出被引用消息的原文，群友 ID / 昵称一律匿名。
      - name: Build view
        env:
          DISPLAY_NAME: Terry
          DISPLAY_NAME_ZH_CN: ${{ secrets.DISPLAY_NAME_ZH_CN }}
          DISPLAY_NAME_ZH_TW: ${{ secrets.DISPLAY_NAME_ZH_TW }}
          DISPLAY_NAME_EN: ${{ secrets.DISPLAY_NAME_EN }}
          INCLUDE_CONTEXT: "1"
          ANONYMIZE_CONTEXT: "1"
        run: python3 scripts/build_view.py

      # 只发布 dist/，raw 全群数据不进站点产物
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ---- 3. 独立部署 Job：与上传跨 Job 隔离，避开 artifact 最终一致性竞态，且支持安全 Re-run ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
