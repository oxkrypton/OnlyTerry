name: Sync Telegram & Deploy Pages

on:
  schedule:
    # 每 20 分钟，错峰避开整点高负载。GitHub cron 按 UTC、最小粒度 5 分钟、
    # 为 best-effort（高负载会延迟或整次跳过），公共仓库 60 天无活动会自动停用。
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tg-sync-and-pages
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ---- 1. 事实源：全群全量/增量拉取，与展示无关 ----
      # GITHUB_ACTIONS=true 时 fetch_tg.py 跳过 .env，脚本读取的配置只能在此注入。
      # 未配置的 Secret 展开为空串，脚本按各自默认值回落（TARGET_TOPIC 空 = 0 = 全群）。
      # WAIT_TIME 不注入：脚本 float(os.getenv("WAIT_TIME", "1")) 无空串兜底，保持默认 1。
      - name: Fetch raw chat
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TARGET_GROUP: "-1002632177660"
          TARGET_USER: "hackbearterry"
          TARGET_TOPIC: "3"
          TZ_LOCAL: Asia/Shanghai
          # none = 只记媒体元数据：record.media 为 null，dist 不产出图片/附件
          DOWNLOAD_MEDIA: none
          REFRESH_RECENT: "200"
        run: python scripts/fetch_tg.py

      # ---- 2. 展示投影：从 raw 重算，改规则不用重抓 ----
      # i18n.json 只翻译界面文案；消息正文与回复上下文保持 Telegram 原文。
      # 语言包会在此步骤做三语键一致性校验，并随产物复制到 dist/。
      # 站点名可按语言覆盖；未配置的 Secret 为空串，脚本回落 DISPLAY_NAME。
      # ANONYMIZE_CONTEXT 仅在 INCLUDE_CONTEXT=1 时生效。
      # 只改文案不改数据时，定时任务因 data/ 无 diff 不会重新部署，需手动 Run workflow。
      - name: Build view
        env:
          DISPLAY_NAME: Terry
          DISPLAY_NAME_ZH_CN: ${{ secrets.DISPLAY_NAME_ZH_CN }}
          DISPLAY_NAME_ZH_TW: ${{ secrets.DISPLAY_NAME_ZH_TW }}
          DISPLAY_NAME_EN: ${{ secrets.DISPLAY_NAME_EN }}
          INCLUDE_CONTEXT: "0"
          ANONYMIZE_CONTEXT: "1"
        run: python scripts/build_view.py

      # ---- 3. 只提交事实源，dist/ 由 .gitignore 排除 ----
      - name: Commit raw data
        id: git_check
        run: |
          mkdir -p data/raw media dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 不带 pathspec：目录为空时也不会报 "did not match any files"
          # dist/ 由 .gitignore 排除，实际只会提交 data/ 与 media/
          # fetch_tg.py 的游标按全群推进：非目标用户 / 非目标话题的消息也会更新
          # state.json 的 last_msg_id，因此这里的 diff 判定的是「全群有无新消息」，
          # 不等于「站点有无新内容」。
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "全群无新消息，跳过提交与重新部署"
          else
            git commit -m "chore(data): sync telegram raw [skip ci]"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- 4. 只发布 dist/，raw 全群数据不进站点产物 ----
      - name: Upload Pages artifact
        if: steps.git_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.git_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
