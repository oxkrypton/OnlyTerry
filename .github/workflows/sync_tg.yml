name: Sync Telegram

on:
  schedule:
    # 每小时 19、49 分各一次；cron 按 UTC 计算，UTC+8 整点偏移不改变分钟数
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 事实源同步：定时或手动触发，有新数据时触发 deploy_pages.yml 构建并部署
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    concurrency:
      group: tg-sync
      cancel-in-progress: false
    # 两个话题共用同一账号凭证；WAIT_TIME 不注入（脚本无空串兜底，保持默认 1）
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TARGET_GROUP: "-1002632177660"
      TARGET_USER: "hackbearterry"
      TZ_LOCAL: Asia/Shanghai
      # target = 只下目标用户发的图片，存 data/<session>/media/，随 data/ 一起提交
      DOWNLOAD_MEDIA: target
      REFRESH_RECENT: "200"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      # GITHUB_ACTIONS=true 时 fetch_tg.py 跳过 .env，脚本读取的配置只能在此注入。
      # 话题2 的首次全量在本地完成（生成 data/session2/ 并提交），CI 只拉游标之后的新消息。
      # 串行执行，避免同一 StringSession 并发连接；补图逻辑会顺带补齐历史里目标用户缺的图。
      - name: Fetch topic 2 (incremental)
        env:
          TARGET_TOPIC: "2"
        run: python scripts/fetch_tg.py

      - name: Fetch topic 3 (incremental)
        env:
          TARGET_TOPIC: "3"
        run: python scripts/fetch_tg.py

      # 只提交事实源（含目标用户图片），dist/ 由 .gitignore 排除
      - name: Commit raw data
        id: git_check
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 不带 pathspec：目录为空时也不会报 "did not match any files"
          # 实际只提交 data/session*/ 下的 raw / media / state.json
          # 每个 session 的游标各自按全群推进：非目标话题的消息也会推进 last_msg_id，
          # 因此这里的 diff 判定的是「全群有无新消息」，不等于「站点有无新内容」。
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "全群无新消息，跳过提交与重新部署"
          else
            git commit -m "chore(data): sync telegram raw [skip ci]"
            # 本地 push 可能抢先推进 main（如 11-23 那次 rejected），先变基再推
            git pull --rebase origin main
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # 默认 GITHUB_TOKEN 的 git push 不会触发其他 workflow 的 on: push（防递归），
      # 因此有新数据时显式发 workflow_dispatch 触发 deploy_pages.yml（需 actions: write）。
      - name: Trigger Pages build & deploy
        if: steps.git_check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy_pages.yml --repo "${{ github.repository }}" --ref main
