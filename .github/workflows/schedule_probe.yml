name: Schedule Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - ".github/workflows/schedule_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report firing
        run: echo "probe fired event=${{ github.event_name }} schedule=${{ github.event.schedule }} at $(date -u +%FT%TZ)"
