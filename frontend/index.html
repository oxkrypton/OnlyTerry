<!doctype html>
<html lang="zh-CN">

<head>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="cad6953a-355e-471b-8a00-90927ed3a13c"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f8fafc">
  <title>Terry · Message Archive</title>
  <!-- daisyUI v4 官方 CDN 组合：先组件库 CSS，后 Tailwind Play CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <!-- 站点样式：见 style.css；build_view.py 会复制进 dist/ -->
  <link rel="stylesheet" href="./style.css">
  <script>
    /* 首次绘制前定好主题，避免深色模式闪白；data-theme 保留给原有逻辑 */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('tg-archive-theme'); } catch (e) { }
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var t = (saved === 'light' || saved === 'dark') ? saved : (dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.classList.toggle('dark', t === 'dark');
    })();
  </script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans antialiased">
  <div class="max-w-6xl mx-auto px-3 sm:px-4 py-4 lg:py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 items-start">

      <!-- 侧栏：桌面端排在右侧并 sticky；移动端保持最上方单列、不 sticky -->
      <aside class="lg:col-span-4 lg:order-2 lg:sticky lg:top-6 space-y-2.5 lg:max-h-[calc(100vh-3rem)] lg:overflow-y-auto">

        <header class="tg-panel">
          <div class="flex items-center gap-3 min-w-0">
            <div class="min-w-0 flex-1">
              <h1 id="title" class="text-base font-bold text-slate-900 dark:text-slate-100 truncate">Terry · Message Archive</h1>
              <!-- 条数与「更新于…（UTC+8）」各自 nowrap：窄屏最多折成两行，不会把时间与时区拆开 -->
              <div id="meta" class="mt-0.5 flex flex-wrap items-baseline text-[11px] leading-4 text-slate-500 dark:text-slate-400">
                <span id="meta-count" class="whitespace-nowrap"></span>
                <span id="meta-updated" class="whitespace-nowrap"></span>
              </div>
            </div>
            <div class="avatar shrink-0">
              <div class="w-12 h-12 rounded-full ring-1 ring-slate-200 dark:ring-slate-700">
                <img id="header-avatar" src="./avatar.webp" alt="Terry 的头像" class="w-12 h-12 rounded-full object-cover">
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between gap-2 mt-2.5 pt-2.5 border-t border-slate-100 dark:border-slate-700">
            <div id="lang" class="inline-flex gap-1" role="group" aria-label="语言"></div>
            <div class="flex items-center gap-1">
              <button id="subscribeBell" type="button" class="tg-bell" aria-label="订阅更新通知"></button>
              <button id="themeBtn" type="button" data-lucide="moon" aria-pressed="false"
                class="btn btn-xs btn-square btn-ghost text-slate-500 dark:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"></button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-1.5 mt-2.5">
            <div class="tg-stat">
              <p class="tg-stat-label" id="stat-posts-label">消息总数</p>
              <p class="tg-stat-num" id="stat-posts">—</p>
            </div>
            <div class="tg-stat">
              <p class="tg-stat-label" id="stat-sessions-label">频道</p>
              <p class="tg-stat-num" id="stat-sessions">—</p>
            </div>
            <div class="tg-stat">
              <p class="tg-stat-label" id="stat-months-label">跨度</p>
              <p class="tg-stat-num" id="stat-months">—</p>
            </div>
            <div class="tg-stat">
              <p class="tg-stat-label" id="stat-media-label">配图</p>
              <p class="tg-stat-num" id="stat-media">—</p>
            </div>
          </div>
        </header>

        <section class="tg-panel" aria-labelledby="sessions-title">
          <h2 id="sessions-title" class="tg-panel-title">频道分组</h2>
          <div id="sessions" class="space-y-1" role="group" aria-label="分组"></div>
          <div class="tg-bar"><span id="session-bar"></span></div>
        </section>

        <section id="subscribe-card" class="tg-panel" aria-labelledby="subscribe-title">
          <div class="flex items-start justify-between gap-2">
            <h2 id="subscribe-title" class="tg-panel-title" style="margin-bottom:.25rem">订阅更新通知</h2>
            <button id="subscribeClose" type="button" class="tg-sub-close" aria-label="关闭订阅卡片"></button>
          </div>
          <p id="subscribe-desc" class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-2.5">归档有重要观点汇总时，第一时间邮件提醒。</p>
          <form id="subscribe-form" class="flex items-center gap-2">
            <input id="subscribe-email" type="email" required class="tg-sub-input" placeholder="输入你的邮箱…" aria-label="邮箱地址">
            <button id="subscribe-btn" type="submit" class="tg-sub-btn">订阅</button>
          </form>
          <p id="subscribe-feedback" class="tg-is-hidden text-xs mt-2 text-blue-600 dark:text-blue-400"></p>
        </section>

        <section class="tg-panel tg-desktop-only" aria-labelledby="timeline-title">
          <div class="tg-tl-head">
            <h2 id="timeline-title" class="tg-panel-title">时间轴目录</h2>
            <div id="timeline-mode" class="tg-tl-switch" role="group" aria-label="时间轴视图">
              <button id="tl-mode-month" class="tg-tl-mode is-active" type="button" aria-pressed="true" aria-label="按月跳转" title="按月跳转">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                  <rect x="2" y="2.75" width="2.5" height="2.5" rx=".6" fill="currentColor" stroke="none" />
                  <rect x="2" y="6.75" width="2.5" height="2.5" rx=".6" fill="currentColor" stroke="none" />
                  <rect x="2" y="10.75" width="2.5" height="2.5" rx=".6" fill="currentColor" stroke="none" />
                  <path d="M6.5 4h7M6.5 8h7M6.5 12h7" />
                </svg>
              </button>
              <button id="tl-mode-day" class="tg-tl-mode" type="button" aria-pressed="false" aria-label="按天跳转" title="按天跳转">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor">
                  <rect x="2" y="2" width="5" height="5" rx="1" />
                  <rect x="9" y="2" width="5" height="5" rx="1" />
                  <rect x="2" y="9" width="5" height="5" rx="1" />
                  <rect x="9" y="9" width="5" height="5" rx="1" />
                </svg>
              </button>
            </div>
          </div>
          <div id="month-nav" class="space-y-0.5 overflow-y-auto"></div>
          <div id="day-nav" class="tg-is-hidden">
            <div class="tg-cal-head">
              <button id="cal-prev" class="tg-cal-arrow" type="button">&lsaquo;</button>
              <span id="cal-title" class="tg-cal-title"></span>
              <button id="cal-next" class="tg-cal-arrow" type="button">&rsaquo;</button>
            </div>
            <div id="cal-week" class="tg-cal-week"></div>
            <div id="cal-grid" class="tg-cal-grid"></div>
            <p id="cal-hint" class="tg-cal-hint"></p>
          </div>
        </section>
      </aside>

      <!-- 主栏：桌面端排在左侧；消息卡片本体保持原样 -->
      <main class="lg:col-span-8 lg:order-1 min-w-0">
        <div class="tg-panel tg-toolbar flex flex-wrap items-center justify-between gap-2 mb-3">
          <div class="flex items-baseline gap-2 min-w-0">
            <span id="toolbar-title" class="text-sm font-semibold text-slate-900 dark:text-slate-100 truncate">美股</span>
            <span id="toolbar-count" class="text-xs text-slate-500 dark:text-slate-400"></span>
          </div>
          <button id="sortBtn" type="button" class="tg-sort-btn shrink-0" aria-label="切换排序"></button>
        </div>

        <!-- 列表区固定留位；状态文字绝对定位，显隐不占流 -->
        <div class="relative min-h-[60vh]">
          <div id="status" class="absolute inset-x-0 top-0 text-sm text-slate-500 dark:text-slate-400">加载中…</div>
          <div id="list">
            <div class="tg-skeleton"></div>
            <div class="tg-skeleton"></div>
            <div class="tg-skeleton"></div>
          </div>
          <div id="sentinel" class="tg-sentinel" aria-live="polite"></div>
        </div>
      </main>
    </div>
  </div>

  <button id="backTop" type="button" class="tg-back-top" aria-label="回到顶部"></button>

  <!-- 底部常驻搜索栏：玻璃层与内容层分离，折射由 canvas SDF → feDisplacementMap 驱动 -->
  <div class="liquid-glass-search" id="search-wrap" role="search">
    <span class="liquid-glass-surface" id="search-glass" aria-hidden="true">
      <span class="liquid-glass-refraction"></span>
      <svg class="lg-defs" width="0" height="0" focusable="false">
        <defs>
          <filter id="lg-search-glass" filterUnits="userSpaceOnUse" x="0" y="0" width="1" height="1"
            color-interpolation-filters="sRGB">
            <feImage id="lg-image" result="refraction" />
            <feDisplacementMap id="lg-disp" in="SourceGraphic" in2="refraction" xChannelSelector="R"
              yChannelSelector="G" scale="0" />
          </filter>
        </defs>
      </svg>
    </span>
    <svg class="liquid-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <input id="search-input" type="search" placeholder="搜索消息…" autocomplete="off" aria-label="搜索消息"
      class="liquid-search-input">
    <kbd id="search-kbd" class="tg-kbd" aria-hidden="true">/</kbd>
  </div>

  <!-- 图片放大层：display 由 hidden / flex 互斥切换，点背景或按 Esc 关闭 -->
  <div id="lightbox"
    class="hidden fixed inset-0 z-50 items-center justify-center overscroll-contain touch-none select-none outline-none bg-black/80 p-4"
    role="dialog" aria-modal="true" aria-label="" tabindex="-1">
    <button id="lightboxClose" type="button" aria-label=""
      class="absolute top-4 right-4 p-2 rounded-full text-white/80 hover:text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white/70"></button>
    <img id="lightboxImg" alt="" draggable="false" class="max-h-full max-w-full object-contain rounded-lg shadow-2xl">
  </div>

  <!-- 主逻辑 / 液态玻璃折射；defer 保证 DOM 就绪后按序执行 -->
  <script defer src="./app.js"></script>
  <script defer src="./glass.js"></script>
</body>

</html>
